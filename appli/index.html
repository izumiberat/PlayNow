<link rel="manifest" href="manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --primary:#4a6fa5; --primary-dark:#3a5a80; --accent:#e67e22; --accent-dark:#c96a14;
  --bg:#f6f7fb; --card:#fff; --text:#2b2d42; --muted:#5b6070; --border:#e3e6ee; --soft:#eef3fa; --warm:#fff6ec;
  --tabh:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:17px;overscroll-behavior-y:none}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #f4b860;outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(var(--tabh) + env(safe-area-inset-bottom) + 20px)}
@media(min-width:560px){.app{box-shadow:0 0 0 1px var(--border);background:var(--bg)} body{background:#e9ecf3}}

/* Top */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.15rem}
.brand img{width:32px;height:32px;border-radius:8px}
.lang{border:1px solid var(--border);border-radius:999px;padding:6px 10px;background:#fff;font-size:.9rem}
.ages{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:linear-gradient(135deg,#dfe9f7,#eef3fa);border-radius:18px;padding:10px;margin-bottom:14px}
.age{border:2px solid transparent;background:#fff;border-radius:14px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-weight:600;font-size:.9rem;min-height:64px;justify-content:center}
.age .e{font-size:1.5rem;line-height:1.1}
.age[aria-pressed="true"]{background:var(--primary);color:#fff;box-shadow:0 4px 10px rgba(74,111,165,.35)}

/* Panels */
h2{font-size:1.2rem;margin:6px 0 10px}
.label{font-size:.85rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:4px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer;font-size:.92rem;min-height:40px}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;border-radius:16px;padding:14px 8px;min-height:86px;color:#fff;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.08)}
.tile .e{font-size:1.7rem;line-height:1}
.tile:active,.big:active,.age:active{transform:scale(.97)}
.c0{background:linear-gradient(135deg,#2a9d8f,#40c2a8)}.c1{background:linear-gradient(135deg,#e76f51,#f4a261)}
.c2{background:linear-gradient(135deg,#6a4c93,#9b72cf)}.c3{background:linear-gradient(135deg,#d64e8a,#f17fb3)}
.c4{background:linear-gradient(135deg,#3a6ea5,#5d9bd6)}
.big{width:100%;border:0;border-radius:18px;padding:18px;margin-top:12px;background:linear-gradient(135deg,#e67e22,#f4b860);color:#fff;font-size:1.25rem;font-weight:800;cursor:pointer;box-shadow:0 6px 14px rgba(230,126,34,.35)}
.plans{display:grid;gap:10px}
.planbtn{border:1.5px solid var(--border);background:#fff;border-radius:16px;padding:14px;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center}
.planbtn .e{font-size:1.8rem}
.planbtn b{display:block}.planbtn small{color:var(--muted)}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;width:100%;display:block}
.card h3{font-size:1rem;line-height:1.3;margin-bottom:2px}
.card p{color:var(--muted);font-size:.9rem}
.list{display:grid;gap:8px}
.steps{list-style:none;display:grid;gap:8px;counter-reset:s}
.steps li{display:flex;gap:8px;align-items:center}
.steps li::before{counter-increment:s;content:counter(s);flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:600;cursor:pointer;min-height:46px}
.btn-p{background:var(--accent);color:#fff}.btn-g{background:#fff;border:2px solid var(--primary);color:var(--primary)}
.btn-f{background:#fff;border:2px solid var(--accent);color:var(--accent-dark)}
.btn-f[aria-pressed="true"]{background:var(--warm)}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .e{font-size:2.2rem;display:block;margin-bottom:6px}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.92rem;margin:10px 0}
.install{background:#fff;border:1.5px solid var(--accent);border-radius:16px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.install p{flex:1;font-size:.93rem}
.install .x{background:none;border:0;font-size:1.3rem;cursor:pointer;color:var(--muted);padding:0 4px}
.foot{text-align:center;font-size:.85rem;color:var(--muted);margin-top:22px}
.foot a{color:var(--primary)}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabh)}
.tab{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;color:var(--muted);gap:2px}
.tab .e{font-size:1.35rem;line-height:1;filter:grayscale(1);opacity:.7}
.tab[aria-selected="true"]{color:var(--primary);font-weight:700}
.tab[aria-selected="true"] .e{filter:none;opacity:1}

/* Activity sheet */
.sheet{position:fixed;inset:0;background:#fff;z-index:40;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .in{max-width:520px;width:100%;margin:0 auto;flex:1;overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) 18px 16px}
.sheet .bar{max-width:520px;width:100%;margin:0 auto;display:flex;gap:8px;padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--border);background:#fff}
.sheet .bar .btn{flex:1}
.close{position:sticky;top:0;float:right;width:42px;height:42px;border-radius:50%;border:0;background:var(--soft);font-size:1.3rem;cursor:pointer}
.sheet h2{font-size:1.4rem;color:var(--primary-dark);margin:4px 50px 6px 0}
.sheet h3{font-size:1rem;margin:14px 0 6px;color:var(--primary-dark)}
.sheet ul,.sheet ol{padding-left:22px}
.sheet li{margin-bottom:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{background:var(--soft);color:var(--primary-dark);font-size:.8rem;border-radius:999px;padding:3px 10px}
.box{border-radius:12px;padding:10px 12px;font-size:.95rem}
.box.tip{background:var(--warm)}.box.safe{background:#fdeeee}
.cycle{background:var(--soft);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:.92rem}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><img src="icon-192.png" alt="" width="32" height="32">Play Now</div>
    <select class="lang" id="lang" aria-label="Langue / Language / 言語">
      <option value="fr">FR</option><option value="en">EN</option><option value="ja">日本語</option>
    </select>
  </div>

  <div class="install" id="install" hidden>
    <p id="install-text"></p>
    <button type="button" class="btn btn-p" id="install-btn" hidden></button>
    <button type="button" class="x" id="install-x" aria-label="×">×</button>
  </div>

  <div class="ages" role="group" id="ages">
    <button type="button" class="age" data-age="0-2"><span class="e">👶</span><span></span></button>
    <button type="button" class="age" data-age="3-5"><span class="e">🧒</span><span></span></button>
    <button type="button" class="age" data-age="6-8"><span class="e">🎒</span><span></span></button>
    <button type="button" class="age" data-age="9-12"><span class="e">🧑</span><span></span></button>
  </div>

  <!-- Ideas -->
  <section id="p-ideas" role="tabpanel">
    <p class="label" data-t="energy">Votre énergie aujourd'hui</p>
    <div class="chips" id="energy">
      <button type="button" class="chip" data-pe="low"></button>
      <button type="button" class="chip" data-pe="medium"></button>
      <button type="button" class="chip" data-pe="high"></button>
    </div>
    <p class="label" data-t="narrow">Précisez (facultatif)</p>
    <div class="chips" id="narrow">
      <button type="button" class="chip" data-where="indoor"></button>
      <button type="button" class="chip" data-where="outdoor"></button>
      <button type="button" class="chip" data-opt="short"></button>
      <button type="button" class="chip" data-opt="nomat"></button>
    </div>
    <div class="tiles" id="tiles"></div>
    <button type="button" class="big" id="surprise"></button>
  </section>

  <!-- Plans -->
  <section id="p-plans" role="tabpanel" hidden>
    <h2 data-t="plansTitle"></h2>
    <div class="plans" id="planbtns"></div>
    <div id="plan" hidden>
      <h2 id="plan-title" style="margin-top:18px"></h2>
      <p class="muted" id="plan-meta"></p>
      <ol class="steps" id="plan-steps" style="margin-top:10px"></ol>
      <div class="row">
        <button type="button" class="btn btn-p" id="plan-again"></button>
        <button type="button" class="btn btn-f" id="plan-save" aria-pressed="false"></button>
      </div>
    </div>
  </section>

  <!-- Favourites -->
  <section id="p-favs" role="tabpanel" hidden>
    <h2 data-t="favTitle"></h2>
    <p class="note" data-t="favNote"></p>
    <div id="fav-plans" class="list" style="margin-bottom:12px"></div>
    <div id="fav-list" class="list"></div>
    <div class="empty" id="fav-empty"><span class="e">💛</span><span data-t="favEmpty"></span></div>
  </section>

  <p class="foot"><a href="../" id="site-link" data-t="site"></a> · <a href="../submit-activity.html" data-t="idea"></a></p>
</div>

<nav class="tabs" role="tablist">
  <div class="in">
    <button type="button" class="tab" role="tab" data-tab="ideas" aria-controls="p-ideas"><span class="e">💡</span><span data-t="tabIdeas"></span></button>
    <button type="button" class="tab" role="tab" data-tab="plans" aria-controls="p-plans"><span class="e">📋</span><span data-t="tabPlans"></span></button>
    <button type="button" class="tab" role="tab" data-tab="favs" aria-controls="p-favs"><span class="e">⭐</span><span data-t="tabFavs"></span></button>
  </div>
</nav>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title" hidden>
  <div class="in" id="s-in">
    <button type="button" class="close" id="s-close">×</button>
    <div id="s-body"></div>
  </div>
  <div class="bar">
    <button type="button" class="btn btn-f" id="s-fav" aria-pressed="false"></button>
    <button type="button" class="btn btn-p" id="s-next"></button>
  </div>
</div>

var $=function(id){return document.getElementById(id);};
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
var params=new URLSearchParams(location.search);
function pickLang(){var p=params.get('lang');if(T[p])return p;var s=store('play.lang');if(T[s])return s;
  var n=(navigator.languages&&navigator.languages[0]||navigator.language||'fr').toLowerCase();
  if(n.indexOf('fr')===0)return 'fr';if(n.indexOf('ja')===0)return 'ja';return 'en';}
var S={lang:pickLang(),age:AGES.indexOf(store('play.age'))>=0?store('play.age'):'3-5',pe:null,where:null,short:false,nomat:false,tab:'ideas'};
var cache={},byAge={},current=null,mode=null,seen={},cycle=false,relaxed=false,plan=null;
function L(){return T[S.lang];}

function getJSON(u){if(cache[u])return Promise.resolve(cache[u]);return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){cache[u]=d.activities||[];return cache[u];});}
// English file = filter values, language file = text
function getAge(age){
  var base='../assets/json/activities-'+age,lang=S.lang;
  return Promise.all([getJSON(base+'-en.json'),getJSON(base+'-'+FILE_LANG[lang]+'.json')]).then(function(r){
    var t={};r[1].forEach(function(a){t[a.id]=a;});
    var l=r[0].map(function(a){return {f:a,x:t[a.id]||a,age:age};});
    if(lang===S.lang)byAge[age]=l;return l;
  });
}
function list(){return byAge[S.age]||[];}
function energyOk(f){
  if(S.pe==='low'&&f.parentEnergy!=='low')return false;
  if(S.pe==='medium'&&f.parentEnergy==='high')return false;
  if(S.where&&f.location!==S.where&&f.location!=='any')return false;
  if(S.short&&Number(f.duration)>10)return false;
  if(S.nomat&&(f.materials||[]).length)return false;
  return true;
}

function applyLang(){
  var l=L();document.documentElement.lang=S.lang;document.title=l.doc;$('lang').value=S.lang;
  document.querySelectorAll('[data-t]').forEach(function(e){var v=l[e.getAttribute('data-t')];if(typeof v==='string')e.textContent=v;});
  document.querySelectorAll('.age').forEach(function(b){b.lastElementChild.textContent=l.ages[b.dataset.age];});
  document.querySelectorAll('[data-pe]').forEach(function(b){b.textContent=l.pe[b.dataset.pe];});
  document.querySelectorAll('[data-where]').forEach(function(b){b.textContent=l.nw[b.dataset.where];});
  document.querySelectorAll('[data-opt]').forEach(function(b){b.textContent=l.nw[b.dataset.opt];});
  $('surprise').textContent=l.surprise;$('s-close').setAttribute('aria-label',l.close);
  $('plan-again').textContent=l.again;$('s-next').textContent=l.next;
  $('site-link').href='../?lang='+S.lang;
  renderPlanBtns();showInstall();
}
function sync(){
  document.querySelectorAll('.age').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.age===S.age);});
  document.querySelectorAll('[data-pe]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.pe===S.pe);});
  document.querySelectorAll('[data-where]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.where===S.where);});
  document.querySelectorAll('[data-opt]').forEach(function(b){b.setAttribute('aria-pressed',!!S[b.dataset.opt]);});
  document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===S.tab);});
  ['ideas','plans','favs'].forEach(function(t){$('p-'+t).hidden=t!==S.tab;});
}
function renderTiles(){
  var g=$('tiles');g.innerHTML='';
  (AGE_CATS[S.age]||[]).forEach(function(k,i){
    var b=el('button','tile c'+(i%5));b.type='button';
    var e=el('span','e',ICON[k]);e.setAttribute('aria-hidden','true');b.appendChild(e);b.appendChild(el('span',null,L().cats[k]));
    b.addEventListener('click',function(){idea(k);});g.appendChild(b);
  });
}
function idea(k){
  mode=k;var all=list();if(!all.length)return;
  var pool=all.filter(function(a){return TEST[k](a.f)&&energyOk(a.f);});
  relaxed=false;
  if(!pool.length){pool=all.filter(function(a){return energyOk(a.f);});relaxed=k!=='surprise'&&pool.length>0;}
  if(!pool.length){pool=all.filter(function(a){return TEST[k](a.f)&&(!S.where||a.f.location===S.where||a.f.location==='any');});relaxed=true;}
  if(!pool.length)pool=all.filter(function(a){return !S.where||a.f.location===S.where||a.f.location==='any';});
  if(!pool.length)pool=all;
  var key=S.age+'|'+k;seen[key]=seen[key]||{};
  var fresh=pool.filter(function(a){return !seen[key][a.f.id];});
  cycle=false;if(!fresh.length){seen[key]={};fresh=pool;cycle=true;}
  if(fresh.length>1&&current)fresh=fresh.filter(function(a){return a.f.id!==current.f.id;});
  var p=fresh[Math.floor(Math.random()*fresh.length)];seen[key][p.f.id]=true;open(p);
}
function listNode(tag,items){var u=el(tag);items.forEach(function(i){u.appendChild(el('li',null,String(i).replace(/^\s*\d+[\.\)]\s*/,'')));});return u;}
function sec(b,t,n){b.appendChild(el('h3',null,t));b.appendChild(n);}
function open(a){
  current=a;var l=L(),x=a.x,b=$('s-body');b.innerHTML='';
  if(relaxed&&mode){b.appendChild(el('p','cycle',l.relaxed));relaxed=false;}
  if(cycle&&mode){b.appendChild(el('p','cycle',l.cycle));cycle=false;}
  var h=el('h2',null,x.title);h.id='s-title';b.appendChild(h);
  b.appendChild(el('p','muted',x.description));
  var tg=el('div','tags');tg.appendChild(el('span','tag',l.ages[a.age]));tg.appendChild(el('span','tag',(a.f.duration||'?')+l.min));
  if(a.f.location==='indoor'||a.f.location==='outdoor')tg.appendChild(el('span','tag',l[a.f.location]));
  b.appendChild(tg);
  var m=x.materials||[];sec(b,l.materials,m.length?listNode('ul',m):el('p',null,l.none));
  if((x.instructions||[]).length)sec(b,l.steps,listNode('ol',x.instructions));
  if(x.parentTips)sec(b,l.tip,el('p','box tip',x.parentTips));
  if(x.safetyNotes)sec(b,l.safety,el('p','box safe',x.safetyNotes));
  if((x.variations||[]).length)sec(b,l.variations,listNode('ul',x.variations));
  $('s-next').hidden=!mode;syncFav();
  $('sheet').hidden=false;$('s-in').scrollTop=0;document.body.style.overflow='hidden';$('s-close').focus();
}
function closeSheet(){$('sheet').hidden=true;document.body.style.overflow='';}
function fkey(a){return a.age+':'+a.f.id;}
function syncFav(){var on=current&&getList('play.favs').indexOf(fkey(current))>=0,b=$('s-fav');b.setAttribute('aria-pressed',!!on);b.textContent=on?L().on:L().add;}
function toggleFav(){var f=getList('play.favs'),k=fkey(current),i=f.indexOf(k);if(i>=0)f.splice(i,1);else f.unshift(k);store('play.favs',JSON.stringify(f));syncFav();renderFavs();}
function card(a,onClick){var c=el('button','card');c.type='button';c.appendChild(el('h3',null,a.x.title));c.appendChild(el('p',null,L().ages[a.age]+' · '+(a.f.duration||'?')+L().min+' · '+a.x.description));c.addEventListener('click',onClick||function(){mode=null;open(a);});return c;}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function renderPlanBtns(){
  var g=$('planbtns');g.innerHTML='';
  Object.keys(PLAN).forEach(function(k){var p=L().plans[k],b=el('button','planbtn');b.type='button';
    var e=el('span','e',p[0]);e.setAttribute('aria-hidden','true');b.appendChild(e);
    var d=el('span');d.appendChild(el('b',null,p[1]));d.appendChild(el('small',null,p[2]));b.appendChild(d);
    b.addEventListener('click',function(){showPlan(makePlan(k));});g.appendChild(b);});
}
function makePlan(type){
  var P=PLAN[type],pool=shuffle(list().filter(function(a){return P.ok(a.f)&&energyOk(a.f);}));
  if(P.prefer){pool.sort(function(a,b){return (P.prefer(b.f)?1:0)-(P.prefer(a.f)?1:0);});pool=shuffle(pool.slice(0,Math.max(P.n*3,8)));}
  var picks=[],tags={};
  pool.forEach(function(a){if(picks.length<P.n){var t=(a.f.tags||[])[0]||'';if(!tags[t]||pool.length<P.n*2){tags[t]=1;picks.push(a);}}});
  pool.forEach(function(a){if(picks.length<P.n&&picks.indexOf(a)<0)picks.push(a);});
  if(P.down)picks.sort(function(a,b){return (LEVEL[b.f.kidEnergy]||1)-(LEVEL[a.f.kidEnergy]||1);});
  return {type:type,age:S.age,items:picks};
}
function pkey(p){return p.type+'|'+p.age+'|'+p.items.map(function(a){return a.f.id;}).join(',');}
function showPlan(p){
  plan=p;var l=L(),ol=$('plan-steps');ol.innerHTML='';
  $('plan-title').textContent=l.plans[p.type][0]+' '+l.plans[p.type][1]+' · '+l.ages[p.age];
  $('plan-meta').textContent=p.items.length<2?l.few:l.total.replace('{m}',p.items.reduce(function(s,a){return s+(Number(a.f.duration)||0);},0));
  p.items.forEach(function(a){var li=el('li');li.appendChild(card(a));ol.appendChild(li);});
  syncPlan();$('plan').hidden=false;S.tab='plans';sync();$('plan').scrollIntoView({block:'start'});
}
function syncPlan(){var b=$('plan-save'),on=plan&&getList('play.plans').indexOf(pkey(plan))>=0;b.hidden=!plan||plan.items.length<2;b.setAttribute('aria-pressed',!!on);b.textContent=on?L().psaved:L().psave;}
function togglePlan(){var l=getList('play.plans'),k=pkey(plan),i=l.indexOf(k);if(i>=0)l.splice(i,1);else l.unshift(k);store('play.plans',JSON.stringify(l.slice(0,20)));syncPlan();renderFavs();}

function renderFavs(){
  var f=getList('play.favs'),pl=getList('play.plans'),ages={};
  f.forEach(function(k){ages[k.split(':')[0]]=1;});pl.forEach(function(k){ages[k.split('|')[1]]=1;});
  Promise.all(Object.keys(ages).filter(function(a){return AGES.indexOf(a)>=0;}).map(getAge)).then(function(){
    var l=L(),fp=$('fav-plans'),fl=$('fav-list');fp.innerHTML='';fl.innerHTML='';
    pl.forEach(function(k){var p=k.split('|'),src=byAge[p[1]]||[],items=p[2].split(',').map(function(id){return src.filter(function(a){return String(a.f.id)===id;})[0];}).filter(Boolean);
      if(items.length<2)return;var pp={type:p[0],age:p[1],items:items};
      var c=card({x:{title:l.plans[p[0]][0]+' '+l.plans[p[0]][1],description:items.map(function(a){return a.x.title;}).join(', ')},f:{duration:items.reduce(function(s,a){return s+(Number(a.f.duration)||0);},0)},age:p[1]},function(){showPlan(pp);});
      fp.appendChild(c);});
    f.forEach(function(k){var p=k.split(':'),a=(byAge[p[0]]||[]).filter(function(x){return String(x.f.id)===p[1];})[0];if(a)fl.appendChild(card(a));});
    $('fav-empty').hidden=!!(fp.children.length||fl.children.length);
  }).catch(function(){});
}

// Install to home screen
var deferred=null;
function standalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function showInstall(){
  var box=$('install');if(standalone()||store('play.installHide')){box.hidden=true;return;}
  if(deferred){$('install-text').textContent=L().installAndroid;$('install-btn').textContent=L().installBtn;$('install-btn').hidden=false;box.hidden=false;}
  else if(isIOS()){$('install-text').textContent=L().installIOS;$('install-btn').hidden=true;box.hidden=false;}
  else box.hidden=true;
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;showInstall();});
$('install-btn').addEventListener('click',function(){if(!deferred)return;deferred.prompt();deferred.userChoice.then(function(){deferred=null;$('install').hidden=true;});});
$('install-x').addEventListener('click',function(){store('play.installHide','1');$('install').hidden=true;});

function loadAge(){
  $('tiles').innerHTML='';$('tiles').appendChild(el('p','muted',L().loading));
  return getAge(S.age).then(function(){renderTiles();renderFavs();
    // warm the offline cache with the other ages for this language
    AGES.forEach(function(a){if(a!==S.age)getAge(a).catch(function(){});});
  }).catch(function(){$('tiles').innerHTML='';$('tiles').appendChild(el('p','muted',L().error));});
}

// Events
$('lang').addEventListener('change',function(){S.lang=this.value;store('play.lang',S.lang);byAge={};plan=null;$('plan').hidden=true;applyLang();loadAge();});
document.querySelectorAll('.age').forEach(function(b){b.addEventListener('click',function(){S.age=b.dataset.age;store('play.age',S.age);current=null;sync();loadAge();});});
document.querySelectorAll('[data-pe]').forEach(function(b){b.addEventListener('click',function(){S.pe=S.pe===b.dataset.pe?null:b.dataset.pe;sync();});});
document.querySelectorAll('[data-where]').forEach(function(b){b.addEventListener('click',function(){S.where=S.where===b.dataset.where?null:b.dataset.where;sync();});});
document.querySelectorAll('[data-opt]').forEach(function(b){b.addEventListener('click',function(){S[b.dataset.opt]=!S[b.dataset.opt];sync();});});
document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){S.tab=b.dataset.tab;sync();window.scrollTo(0,0);if(S.tab==='favs')renderFavs();});});
$('surprise').addEventListener('click',function(){idea('surprise');});
$('s-next').addEventListener('click',function(){if(mode)idea(mode);});
$('s-close').addEventListener('click',closeSheet);
$('s-fav').addEventListener('click',function(){if(current)toggleFav();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('sheet').hidden)closeSheet();});
$('plan-again').addEventListener('click',function(){if(plan)showPlan(makePlan(plan.type));});
$('plan-save').addEventListener('click',function(){if(plan)togglePlan();});

applyLang();sync();loadAge();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
</body>
</html>
